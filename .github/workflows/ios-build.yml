name: Build iOS .ipa

on:
  workflow_dispatch:
    inputs:
      project_path:
        description: 'Path to .xcworkspace or .xcodeproj (optional — auto-detect if empty)'
        required: false
      scheme:
        description: 'Scheme name (optional — auto-detect if empty)'
        required: false
      export_method:
        description: 'Export method: app-store, ad-hoc, enterprise, development'
        required: false
        default: development

jobs:
  build:
    runs-on: macos-latest
    env:
      EXPORT_METHOD: "${{ github.event.inputs.export_method }}"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install CocoaPods (if Podfile exists)
        run: |
          if [ -f "Podfile" ]; then
            echo 'Podfile found — installing CocoaPods and running pod install'
            sudo gem install cocoapods --no-document || true
            pod install --repo-update || true
          else
            echo 'No Podfile, skipping CocoaPods step'
          fi

      - name: Import signing certificate and provisioning profile (manual signing)
        if: ${{ secrets.P12_BASE64 }}
        run: |
          set -e
          echo "Importing certificate..."
          echo "${{ secrets.P12_BASE64 }}" | base64 --decode > cert.p12
          security create-keychain -p actions build.keychain
          security import cert.p12 -k ~/Library/Keychains/build.keychain -P "${{ secrets.P12_PASSWORD }}" -T /usr/bin/codesign
          security list-keychains -s ~/Library/Keychains/build.keychain
          security default-keychain -s ~/Library/Keychains/build.keychain
          security unlock-keychain -p actions ~/Library/Keychains/build.keychain
          mkdir -p "~/Library/MobileDevice/Provisioning Profiles"
          echo "${{ secrets.MOBILEPROVISION_BASE64 }}" | base64 --decode > "~/Library/MobileDevice/Provisioning Profiles/profile.mobileprovision"

      - name: Determine project/workspace and scheme
        id: detect
        run: |
          set -e
          # Project path input takes priority
          if [ -n "${{ github.event.inputs.project_path }}" ]; then
            echo "Using provided project_path: ${{ github.event.inputs.project_path }}"
            echo "PROJECT_PATH=${{ github.event.inputs.project_path }}" >> $GITHUB_ENV
          else
            ws=$(ls *.xcworkspace 2>/dev/null | head -n1 || true)
            proj=$(ls *.xcodeproj 2>/dev/null | head -n1 || true)
            if [ -n "$ws" ]; then
              echo "Detected workspace: $ws"
              echo "PROJECT_PATH=$ws" >> $GITHUB_ENV
            elif [ -n "$proj" ]; then
              echo "Detected project: $proj"
              echo "PROJECT_PATH=$proj" >> $GITHUB_ENV
            else
              echo "No .xcworkspace or .xcodeproj found and no project_path input provided"
              exit 1
            fi
          fi

          # Scheme: use input if provided, otherwise try to detect
          if [ -n "${{ github.event.inputs.scheme }}" ]; then
            echo "SCHEME=${{ github.event.inputs.scheme }}" >> $GITHUB_ENV
            echo "Detected scheme from input: ${{ github.event.inputs.scheme }}"
          else
            echo "Attempting to detect scheme..."
            if [[ "$PROJECT_PATH" == *.xcworkspace ]]; then
              schemes=$(xcodebuild -workspace "$PROJECT_PATH" -list 2>/dev/null | sed -n '/Schemes:/,/^$/p' | sed '1d' | sed '/^$/d' | sed 's/^\s*//' || true)
            else
              schemes=$(xcodebuild -project "$PROJECT_PATH" -list 2>/dev/null | sed -n '/Schemes:/,/^$/p' | sed '1d' | sed '/^$/d' | sed 's/^\s*//' || true)
            fi
            first=$(echo "$schemes" | head -n1)
            if [ -n "$first" ]; then
              echo "SCHEME=$first" >> $GITHUB_ENV
              echo "Detected scheme: $first"
            else
              echo "Could not detect scheme. Please provide the scheme input when running this workflow."
              exit 1
            fi
          fi

      - name: Configure code signing style
        run: |
          if [ -n "${{ secrets.P12_BASE64 }}" ]; then
            echo "Using Manual signing"
            echo "CODE_SIGN_STYLE=Manual" >> $GITHUB_ENV
          else
            echo "Using Automatic signing"
            echo "CODE_SIGN_STYLE=Automatic" >> $GITHUB_ENV
          fi

      - name: Archive app
        run: |
          set -e
          echo "Archive started for scheme: $SCHEME"
          BUILD_DIR=build
          ARCHIVE_PATH="$BUILD_DIR/$SCHEME.xcarchive"
          mkdir -p "$BUILD_DIR"
          if [[ "$PROJECT_PATH" == *.xcworkspace ]]; then
            xcodebuild -workspace "$PROJECT_PATH" -scheme "$SCHEME" -sdk iphoneos -configuration Release archive -archivePath "$ARCHIVE_PATH" CODE_SIGN_STYLE=$CODE_SIGN_STYLE | xcpretty || true
          else
            xcodebuild -project "$PROJECT_PATH" -scheme "$SCHEME" -sdk iphoneos -configuration Release archive -archivePath "$ARCHIVE_PATH" CODE_SIGN_STYLE=$CODE_SIGN_STYLE | xcpretty || true
          fi

      - name: Create ExportOptions.plist
        run: |
          cat > ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>${{ env.EXPORT_METHOD }}</string>
            <key>compileBitcode</key>
            <false/>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          EOF

      - name: Export .ipa
        run: |
          set -e
          BUILD_DIR=build
          ARCHIVE_PATH="$BUILD_DIR/$SCHEME.xcarchive"
          xcodebuild -exportArchive -archivePath "$ARCHIVE_PATH" -exportOptionsPlist ExportOptions.plist -exportPath "$BUILD_DIR" | xcpretty || true

      - name: Upload .ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: build/*.ipa
